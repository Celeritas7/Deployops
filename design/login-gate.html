<!-- @dsCard group="App shell" viewport="1180x800" name="Login gate — drawing-sheet frame" subtitle="Invitation-only gate styled as an engineering drawing: sheet frame with zone markings, title block, features annotated as ballooned callouts with a grouping ellipse. Demo strip: admin / operator / viewer / not-invited." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090f; --surface:#0f1219; --surface2:#161c28; --surface3:#1e2538;
    --border:#2a3350; --line:#3b4770; --text:#e2e8f0; --text2:#94a3b8; --accent:#60a5fa;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --violet:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px 34px 64px;
    background-image:linear-gradient(rgba(96,165,250,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.045) 1px,transparent 1px),linear-gradient(rgba(96,165,250,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.025) 1px,transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ── drawing-sheet frame ── */
  .sheet{position:relative;width:1040px;max-width:100%;background:var(--surface);border:2px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .sheet::after{content:'';position:absolute;inset:10px;border:1px solid var(--border);pointer-events:none}
  .zone{position:absolute;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:1px;opacity:.75}
  .tick{position:absolute;background:var(--line)}

  .inner{position:relative;display:flex;margin:10px;min-height:640px}

  /* ── left: annotated brand field ── */
  .brand{flex:1.15;padding:46px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--border);position:relative}
  .doc-line{display:flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);letter-spacing:1.5px}
  .doc-line .st{display:inline-flex;align-items:center;gap:6px;color:var(--green)}
  .doc-line .st i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .word{margin-top:34px;font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.04}
  .word small{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--accent);letter-spacing:3px;margin-top:12px}
  .lede{color:var(--text2);font-size:14px;line-height:1.65;max-width:360px;margin:20px 0 0}

  /* ballooned feature callouts */
  .callouts{position:relative;margin:40px 0 0;padding:34px 20px 24px 24px}
  .callouts svg.ell{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .co{display:flex;align-items:center;gap:0;position:relative;padding:11px 0}
  .balloon{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;border:2px solid #0b0e16;box-shadow:0 0 0 1.5px currentColor;z-index:1}
  .balloon i{font-style:normal;color:#0b0e16}
  .leader{height:2px;width:34px;flex-shrink:0;position:relative}
  .leader::after{content:'';position:absolute;right:-1px;top:-4px;border-left:8px solid;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left-color:inherit}
  .co .txt{font-size:13.5px;color:var(--text);padding-left:12px}
  .co .txt em{display:block;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);letter-spacing:.8px;margin-top:2px}
  .kit-chip{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#a78bfa;color:#0b0e16;border:1.5px solid #0b0e16;border-radius:11px;padding:3px 14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.5px;z-index:2;white-space:nowrap}

  /* title block */
  .tblock{margin-top:auto;border:1px solid var(--line);border-bottom:none;display:grid;grid-template-columns:1.4fr 1fr 1fr;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);background:var(--surface2)}
  .tblock>div{padding:8px 12px;border-right:1px solid var(--border);border-top:1px solid var(--border)}
  .tblock>div:nth-child(3n){border-right:none}
  .tblock b{display:block;color:var(--text);font-size:11px;font-weight:600;margin-top:2px;letter-spacing:.5px}
  .tblock .lab{font-size:8.5px;letter-spacing:1.2px;opacity:.7}

  /* ── right: access panel ── */
  .form{flex:1;padding:46px 48px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,rgba(22,28,40,.5),transparent 30%)}
  .form-head{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:10px}
  .form h2{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.4px}
  .form .hint{color:var(--text2);font-size:12.5px;margin:0 0 26px;line-height:1.55}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
  .btn-google:hover{border-color:var(--accent);background:var(--surface3)}
  .btn-google img{width:16px;height:16px}
  .div{display:flex;align-items:center;gap:12px;color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:9.5px;margin:20px 0;letter-spacing:1.5px}
  .div::before,.div::after{content:'';flex:1;height:1px;background:var(--border)}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--text2);letter-spacing:1.5px;margin:0 0 6px}
  .form input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:11px 13px;border-radius:7px;font-size:13.5px;font-family:'JetBrains Mono',monospace;margin-bottom:15px;outline:none;transition:all .15s}
  .form input::placeholder{color:#4a5670;font-family:'JetBrains Mono',monospace}
  .form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,165,250,.15)}
  .btn-primary{width:100%;padding:12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#04070d;font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:1.5px;cursor:pointer;transition:all .15s;margin-top:4px}
  .btn-primary:hover{filter:brightness(1.12);box-shadow:0 0 24px rgba(96,165,250,.35)}
  .btn-primary:disabled{opacity:.7;cursor:default}
  .foot{margin-top:20px;font-size:11.5px;color:var(--text2);text-align:center;line-height:1.55}
  .foot b{color:var(--text)}

  .alert{display:none;align-items:flex-start;gap:9px;padding:11px 13px;border-radius:7px;font-size:12.5px;line-height:1.5;margin-bottom:18px}
  .alert.show{display:flex}
  .alert.err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.45);color:#fca5a5}
  .alert.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.45);color:#6ee7b7}
  .role-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:1px}
  .role-pill .dot{width:7px;height:7px;border-radius:50%}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(4,7,13,.35);border-top-color:#04070d;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .demo{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#000;border:1px solid var(--border);border-radius:999px;padding:5px 8px 5px 14px;font-size:10px;color:var(--text2);font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
  .demo button{border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:999px;padding:3px 10px;font-size:10px;font-family:inherit;cursor:pointer}
  .demo button:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body data-screen-label="Login gate">
<div class="sheet">
  <span class="zone" style="top:-16px;left:16%">1</span><span class="zone" style="top:-16px;left:50%">2</span><span class="zone" style="top:-16px;left:83%">3</span>
  <span class="zone" style="bottom:-16px;left:16%">1</span><span class="zone" style="bottom:-16px;left:50%">2</span><span class="zone" style="bottom:-16px;left:83%">3</span>
  <span class="zone" style="left:-14px;top:24%">A</span><span class="zone" style="left:-14px;top:60%">B</span>
  <span class="zone" style="right:-14px;top:24%">A</span><span class="zone" style="right:-14px;top:60%">B</span>
  <span class="tick" style="top:-2px;left:33%;width:2px;height:12px"></span><span class="tick" style="top:-2px;left:66%;width:2px;height:12px"></span>
  <span class="tick" style="bottom:-2px;left:33%;width:2px;height:12px"></span><span class="tick" style="bottom:-2px;left:66%;width:2px;height:12px"></span>
  <span class="tick" style="left:-2px;top:46%;width:12px;height:2px"></span><span class="tick" style="right:-2px;top:46%;width:12px;height:2px"></span>

  <div class="inner">
    <div class="brand">
      <div class="word">DeployOps<small>DEPLOYMENT OPERATIONS</small></div>

      <div class="callouts">
        <svg class="ell" viewBox="0 0 400 190" preserveAspectRatio="none">
          <ellipse cx="200" cy="95" rx="196" ry="91" fill="none" stroke="#a78bfa" stroke-width="2.5"></ellipse>
        </svg>
        <span class="kit-chip">CREW KIT</span>
        <div class="co"><span class="balloon" style="background:#60a5fa;color:#60a5fa"><i>1</i></span><span class="leader" style="background:#60a5fa;border-left-color:#60a5fa;color:#60a5fa"></span><span class="txt">Annotated drawings</span></div>
        <div class="co"><span class="balloon" style="background:#34d399;color:#34d399"><i>2</i></span><span class="leader" style="background:#34d399;color:#34d399"></span><span class="txt">Phase checklists</span></div>
        <div class="co"><span class="balloon" style="background:#fbbf24;color:#fbbf24"><i>3</i></span><span class="leader" style="background:#fbbf24;color:#fbbf24"></span><span class="txt">Deployment units</span></div>
      </div>
    </div>

    <div class="form">
      <div class="form-head">// ACCESS</div>
      <h2>Sign in</h2>
      <p class="hint">Invitation-only. Sign in with your invited account.</p>
      <div class="alert err" id="errBox"><span>⛔</span><span id="errTxt"></span></div>
      <div class="alert ok" id="okBox"><span>✔</span><span id="okTxt"></span></div>
      <button class="btn-google" onclick="demoSignIn('google')"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Continue with Google</button>
      <div class="div">OR WITH EMAIL</div>
      <label for="em">EMAIL</label>
      <input id="em" type="email" placeholder="email" autocomplete="username">
      <label for="pw">PASSWORD</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-primary" id="signBtn" onclick="demoSignIn('email')">SIGN IN →</button>
      <div class="foot">No account? Ask an admin to add you.</div>
    </div>
  </div>
</div>

<div class="demo">
  DEMO — sign in as:
  <button onclick="fill('aniket@telexistence.co.jp')">admin</button>
  <button onclick="fill('operator1@telexistence.co.jp')">operator</button>
  <button onclick="fill('viewer@partner.example')">viewer</button>
  <button onclick="fill('stranger@gmail.com')">not invited</button>
</div>

<script>
  const PROFILES = {
    'aniket@telexistence.co.jp':    { role:'ADMIN',    color:'#f87171', can:'Full editing — drawings, checklists, models, user management' },
    'operator1@telexistence.co.jp': { role:'OPERATOR', color:'#34d399', can:'Can tick phase-checklist items; everything else read-only' },
    'viewer@partner.example':       { role:'VIEWER',   color:'#60a5fa', can:'Read-only access to all tabs' },
  };
  const em = document.getElementById('em'), pw = document.getElementById('pw');
  function fill(v){ em.value = v; pw.value = 'demo-password'; hide(); em.focus(); }
  function hide(){ errBox.classList.remove('show'); okBox.classList.remove('show'); }
  function demoSignIn(kind){
    hide();
    const email = kind === 'google' ? (em.value.trim() || 'aniket@telexistence.co.jp') : em.value.trim();
    if (kind === 'email' && (!email || !pw.value)){ showErr('Enter your email and password.'); return; }
    const btn = document.getElementById('signBtn');
    btn.innerHTML = '<span class="spin"></span>AUTHENTICATING…'; btn.disabled = true;
    setTimeout(() => {
      btn.textContent = 'SIGN IN →'; btn.disabled = false;
      const p = PROFILES[email.toLowerCase()];
      if (!p){ showErr('This account isn\u2019t on the DeployOps access list. Ask an admin to invite ' + email + '.'); return; }
      document.getElementById('okTxt').innerHTML =
        'Signed in as <b>' + email + '</b> &nbsp;<span class="role-pill" style="background:' + p.color + '22;color:' + p.color + '">' +
        '<span class="dot" style="background:' + p.color + '"></span>' + p.role + '</span><br><span style="opacity:.75">' + p.can + '. App loads next.</span>';
      okBox.classList.add('show');
    }, 700);
  }
  function showErr(t){ document.getElementById('errTxt').textContent = t; errBox.classList.add('show'); }
</script>
</body>
</html>
